<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#1a3a5c" stroke="#3a6a9a" stroke-width="2"/>
  <!-- Head -->
  <ellipse cx="50" cy="52" rx="32" ry="30" fill="#e8c090"/>
  <!-- Brown patches -->
  <ellipse cx="32" cy="40" rx="14" ry="12" fill="#8b5a2a"/>
  <ellipse cx="70" cy="38" rx="12" ry="11" fill="#8b5a2a"/>
  <!-- Ears (long floppy) -->
  <ellipse cx="16" cy="55" rx="11" ry="24" fill="#5a3a1a" transform="rotate(-20 16 55)"/>
  <ellipse cx="84" cy="55" rx="11" ry="24" fill="#5a3a1a" transform="rotate(20 84 55)"/>
  <ellipse cx="18" cy="55" rx="6" ry="16" fill="#8b5a2a" transform="rotate(-20 18 55)"/>
  <ellipse cx="82" cy="55" rx="6" ry="16" fill="#8b5a2a" transform="rotate(20 82 55)"/>
  <!-- Eyes -->
  <ellipse cx="38" cy="48" rx="6.5" ry="7.5" fill="#fff"/>
  <ellipse cx="62" cy="48" rx="6.5" ry="7.5" fill="#fff"/>
  <circle cx="39" cy="49" r="3.8" fill="#2a1a0a"/>
  <circle cx="63" cy="49" r="3.8" fill="#2a1a0a"/>
  <circle cx="40.5" cy="47.5" r="1.3" fill="#fff"/>
  <circle cx="64.5" cy="47.5" r="1.3" fill="#fff"/>
  <!-- Nose -->
  <ellipse cx="50" cy="60" rx="7" ry="5.5" fill="#1a1a1a"/>
  <!-- Mouth -->
  <path d="M43 67 Q50 74 57 67" stroke="#3a2a1a" stroke-width="1.5" fill="none"/>
  <ellipse cx="50" cy="72" rx="5" ry="4" fill="#ff6b8a"/>
  <!-- White muzzle -->
  <ellipse cx="50" cy="64" rx="12" ry="8" fill="#f5e8d0" opacity="0.7"/>
  <!-- Collar -->
  <rect x="30" y="80" width="40" height="7" rx="3" fill="#2e8b3a"/>
  <circle cx="50" cy="83.5" r="3.5" fill="#ffd700"/>
</svg>
