<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#1a3a5c" stroke="#3a6a9a" stroke-width="2"/>
  <!-- Bone shape -->
  <g transform="rotate(-25 50 50)">
    <!-- Left knobs -->
    <circle cx="22" cy="38" r="12" fill="#f5e6c8"/>
    <circle cx="22" cy="62" r="12" fill="#f5e6c8"/>
    <!-- Right knobs -->
    <circle cx="78" cy="38" r="12" fill="#f5e6c8"/>
    <circle cx="78" cy="62" r="12" fill="#f5e6c8"/>
    <!-- Shaft -->
    <rect x="22" y="42" width="56" height="16" rx="4" fill="#f5e6c8"/>
    <!-- Highlights -->
    <ellipse cx="22" cy="36" rx="6" ry="4" fill="#fff8e8" opacity="0.6"/>
    <ellipse cx="78" cy="36" rx="6" ry="4" fill="#fff8e8" opacity="0.6"/>
    <rect x="30" y="44" width="40" height="5" rx="2" fill="#fff8e8" opacity="0.4"/>
  </g>
</svg>
