<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="48" fill="#1a3a5c" stroke="#3a6a9a" stroke-width="2"/>
  <!-- Round head -->
  <circle cx="50" cy="52" r="34" fill="#e8c090"/>
  <!-- Ears (small folded) -->
  <ellipse cx="22" cy="38" rx="11" ry="14" fill="#c09060" transform="rotate(-30 22 38)"/>
  <ellipse cx="78" cy="38" rx="11" ry="14" fill="#c09060" transform="rotate(30 78 38)"/>
  <ellipse cx="24" cy="40" rx="6" ry="8" fill="#d4a870" transform="rotate(-30 24 40)"/>
  <ellipse cx="76" cy="40" rx="6" ry="8" fill="#d4a870" transform="rotate(30 76 40)"/>
  <!-- Wrinkles -->
  <path d="M30 42 Q50 38 70 42" stroke="#c09060" stroke-width="2" fill="none"/>
  <path d="M32 48 Q50 45 68 48" stroke="#c09060" stroke-width="1.5" fill="none"/>
  <!-- Eyes (big bulging) -->
  <ellipse cx="36" cy="50" rx="9" ry="10" fill="#fff"/>
  <ellipse cx="64" cy="50" rx="9" ry="10" fill="#fff"/>
  <circle cx="37" cy="51" r="5" fill="#2a1a0a"/>
  <circle cx="65" cy="51" r="5" fill="#2a1a0a"/>
  <circle cx="38.5" cy="49" r="1.8" fill="#fff"/>
  <circle cx="66.5" cy="49" r="1.8" fill="#fff"/>
  <!-- Black mask -->
  <ellipse cx="50" cy="62" rx="18" ry="12" fill="#3a2a1a"/>
  <!-- Nose -->
  <ellipse cx="50" cy="58" rx="8" ry="6" fill="#1a1a1a"/>
  <!-- Mouth / tongue -->
  <path d="M42 68 Q50 80 58 68" fill="#e05070"/>
  <ellipse cx="50" cy="74" rx="7" ry="6" fill="#ff6b8a"/>
  <!-- Collar -->
  <rect x="28" y="82" width="44" height="7" rx="3" fill="#e05050"/>
  <circle cx="50" cy="85.5" r="3.5" fill="#ffd700"/>
</svg>
