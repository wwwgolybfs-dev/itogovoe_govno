<!DOCTYPE html>
<html lang="ru">
<head>
<script>
  (function(){var p=new URLSearchParams(location.search);document.documentElement.setAttribute('data-theme',p.get('theme')==='dark'?'dark':'light');})();
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Минёр — Petzker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../petzker-sdk.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--blue:#2E7BEE;--orange:#F0921A;--green:#22C55E;--red:#EF4444;--purple:#A855F7;
  --bg:#F6F8FA;--surface:#FFFFFF;--border:#E8ECF0;--text:#1A1D23;--text-muted:#8A94A0;
  --radius:16px;--radius-sm:10px;--board-bg:#1B2440;}
[data-theme="dark"]{--bg:#14171C;--surface:#1C2028;--border:#2A2F38;--text:#ECEEF1;--text-muted:#8B94A0;--board-bg:#12182C;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;transition:background-color .2s,color .2s}
.m-container{max-width:460px;margin:0 auto;padding:16px 16px 28px}
.m-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.m-title{font-size:18px;font-weight:800}
.m-reset-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text-muted);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.m-reset-btn:hover{color:var(--blue);border-color:var(--blue)}
.m-reset-btn:active{transform:scale(.9) rotate(-25deg)}
.m-player{font-size:12px;color:var(--text-muted);margin-bottom:14px}
.m-difficulty{display:flex;gap:8px;margin-bottom:16px}
.m-diff-btn{flex:1;padding:10px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;color:var(--text-muted);font-family:inherit}
.m-diff-btn.active{background:var(--blue);color:white;border-color:var(--blue)}
.m-diff-btn:active{transform:scale(.97)}
.m-stats{display:flex;gap:10px;margin-bottom:16px}
.m-stat-box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;text-align:center}
.m-stat-label{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.m-stat-value{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.m-stat-value.timer{color:var(--blue)}
.m-stat-value.rating{color:var(--purple)}

/* Баннер рейтинга */
.m-rating-banner{background:linear-gradient(135deg,#7C3AED,#2E7BEE);border-radius:var(--radius-sm);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;color:#fff;margin-bottom:16px}
.m-rating-info{font-size:12px;opacity:.85}
.m-rating-pts{font-size:18px;font-weight:800}

.m-board-wrap{background:var(--board-bg);border-radius:var(--radius);padding:8px;box-shadow:0 4px 16px rgba(0,0,0,.18);margin-bottom:16px;position:relative}
.m-board{display:grid;gap:2px;aspect-ratio:1;margin:0 auto}
.m-cell{border-radius:4px;background:rgba(255,255,255,0.07);transition:background-color .1s,transform .1s;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;cursor:pointer;user-select:none;color:var(--text);position:relative}
.m-cell.revealed{background:rgba(255,255,255,0.15);cursor:default}
.m-cell.mine.revealed{background:var(--red);color:white}
.m-cell.flag::after{content:'🚩';font-size:16px}
.m-cell:active:not(.revealed){transform:scale(.92)}
.m-cell .num-1{color:var(--blue)}.m-cell .num-2{color:var(--green)}.m-cell .num-3{color:var(--red)}
.m-cell .num-4{color:#1A237E}.m-cell .num-5{color:#7B1FA2}.m-cell .num-6{color:#00695C}
.m-cell .num-7{color:#4E342E}.m-cell .num-8{color:#424242}
.m-controls{display:flex;gap:8px;margin-bottom:16px}
.m-btn{flex:1;padding:12px;background:var(--blue);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .15s}
.m-btn:active{transform:scale(.97)}
.m-leaderboard{margin-bottom:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px}
.m-lb-title{font-size:13px;font-weight:700;margin-bottom:10px}
.m-lb-row{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px solid var(--border)}
.m-lb-row:last-child{border-bottom:none}
.m-lb-row.me{color:var(--blue);font-weight:700}
.m-lb-rank{width:18px;color:var(--text-muted);font-weight:700}
.m-lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-lb-score{font-weight:700;font-variant-numeric:tabular-nums}
.m-lb-empty{font-size:12.5px;color:var(--text-muted);padding:4px 0}
.m-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(16px) scale(.9);background:#1A1D23;color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s,transform .3s cubic-bezier(.34,1.56,.64,1);z-index:300;pointer-events:none;white-space:nowrap;max-width:90vw;text-align:center}
.m-toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.m-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:center;justify-content:center;padding:24px;opacity:0;transition:opacity .2s}
.m-overlay.open{display:flex;opacity:1}
.m-modal{background:var(--surface);border-radius:var(--radius);padding:28px 24px;text-align:center;max-width:320px;width:100%;animation:modalPop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes modalPop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.m-modal-emoji{font-size:40px;margin-bottom:8px}
.m-modal-title{font-size:19px;font-weight:800;margin-bottom:10px}
.m-modal-score{font-size:14px;color:var(--text-muted);margin-bottom:4px}
.m-modal-score b{color:var(--text);font-size:20px}
.m-modal-rating{font-size:13px;color:var(--purple);font-weight:700;margin-bottom:4px}
.m-modal-best{font-size:13px;color:var(--orange);font-weight:600;margin-bottom:20px;min-height:18px}
.m-btn-primary{width:100%;padding:14px;background:var(--blue);color:#fff;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s,transform .15s}
.m-btn-primary:active{transform:scale(.97)}
</style>
</head>
<body>
<div class="m-container">
  <div class="m-header">
    <div class="m-title">💣 Минёр</div>
    <button class="m-reset-btn" onclick="confirmNewGame()" aria-label="Новая игра">↻</button>
  </div>
  <div class="m-player" id="player-name"></div>
  <div class="m-difficulty">
    <button class="m-diff-btn active" onclick="setDifficulty('easy',event)">Easy 8×8</button>
    <button class="m-diff-btn" onclick="setDifficulty('medium',event)">Medium 12×12</button>
    <button class="m-diff-btn" onclick="setDifficulty('hard',event)">Hard 16×16</button>
  </div>
  <div class="m-stats">
    <div class="m-stat-box"><div class="m-stat-label">⏱ Время</div><div class="m-stat-value timer" id="timer">0:00</div></div>
    <div class="m-stat-box"><div class="m-stat-label">🚩 Флаги</div><div class="m-stat-value" id="flags">0</div></div>
    <div class="m-stat-box"><div class="m-stat-label">💰 Рейтинг</div><div class="m-stat-value rating" id="rating-val">—</div></div>
  </div>
  <div class="m-rating-banner">
    <div class="m-rating-info">💎 Победа приносит очки в рейтинг</div>
    <div class="m-rating-pts" id="session-pts">+0</div>
  </div>
  <div class="m-board-wrap"><div class="m-board" id="board"></div></div>
  <div class="m-controls"><button class="m-btn" onclick="confirmNewGame()">🔄 Новая игра</button></div>
  <div class="m-leaderboard">
    <div class="m-lb-title">🏆 Рекорды Минёра</div>
    <div id="lb-list"><div class="m-lb-empty">Загрузка…</div></div>
  </div>
</div>

<div class="m-overlay" id="game-over-overlay">
  <div class="m-modal">
    <div class="m-modal-emoji" id="modal-emoji">🎉</div>
    <div class="m-modal-title" id="modal-title">Вы выиграли!</div>
    <div class="m-modal-score">Время: <b id="final-time">0:00</b></div>
    <div class="m-modal-rating" id="modal-rating"></div>
    <div class="m-modal-best" id="final-best-note"></div>
    <button class="m-btn-primary" onclick="init()">Новая игра</button>
  </div>
</div>
<div class="m-toast" id="toast"></div>

<script>
const SUPABASE_URL='https://heubrattlnikielnfheg.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhldWJyYXR0bG5pa2llbG5maGVnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NzYyMjcsImV4cCI6MjEwMDU1MjIyN30._lRs77YnsILFN_Ru4uR2wDWQFtAlazZh8UaaKa7fsnM';
let sbClient=null; try{sbClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}catch(e){}

let player=null;
function resolvePlayer(){
  const p=new URLSearchParams(location.search); const uid=p.get('uid'),name=p.get('name');
  if(uid){player={id:uid,name:name||('User '+uid)};return;}
  try{const tg=window.Telegram&&window.Telegram.WebApp;const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
    if(u&&u.id)player={id:String(u.id),name:[u.first_name,u.last_name].filter(Boolean).join(' ').trim()||u.username||('User '+u.id)};}catch(e){}
}

// Очки за победу
const SCORE_TABLE={easy:100,medium:250,hard:500};
let sessionPts=0;

async function reportWin(elapsed,diff){
  const base=SCORE_TABLE[diff]||100;
  // Бонус за скорость: чем быстрее, тем больше
  const speedBonus=Math.max(0,Math.floor(300-elapsed*2));
  const total=base+speedBonus; sessionPts=total;
  document.getElementById('session-pts').textContent='+'+total;
  if(!player)return total;
  try{
    if(typeof PetzkerSDK!=='undefined'){
      const neu=await PetzkerSDK.reportScore('minesweeper',total,{elapsed,diff});
      if(neu!=null) document.getElementById('rating-val').textContent=neu;
      else loadRating();
    } else loadRating();
  }catch(e){console.error(e);}
  return total;
}

async function loadRating(){
  if(!sbClient||!player)return;
  try{const{data}=await sbClient.from('player_ratings').select('total_score').eq('telegram_user_id',player.id).maybeSingle();
    document.getElementById('rating-val').textContent=data?data.total_score:0;}catch(e){}
}

async function refreshLeaderboard(){
  const listEl=document.getElementById('lb-list');
  if(!sbClient){listEl.innerHTML='<div class="m-lb-empty">Локальный режим</div>';return;}
  try{
    // Лучший score сессии minesweeper из game_sessions (не общий рейтинг)
    const{data}=await sbClient.from('game_sessions')
      .select('telegram_user_id,name,score')
      .eq('game_id','minesweeper')
      .order('score',{ascending:false})
      .limit(80);
    if(!data||!data.length){listEl.innerHTML='<div class="m-lb-empty">Пока пусто ✨</div>';return;}
    const best=new Map();
    for(const r of data){
      const id=String(r.telegram_user_id);
      const sc=Number(r.score||0);
      const prev=best.get(id);
      if(!prev||sc>prev.score) best.set(id,{id,name:r.name,score:sc});
    }
    const rows=[...best.values()].sort((a,b)=>b.score-a.score).slice(0,10);
    listEl.innerHTML=rows.map((row,i)=>`<div class="m-lb-row ${player&&String(row.id)===String(player.id)?'me':''}"><span class="m-lb-rank">${i+1}</span><span class="m-lb-name">${escHtml(row.name||'Игрок')}</span><span class="m-lb-score">${row.score}</span></div>`).join('');
  }catch(e){listEl.innerHTML='<div class="m-lb-empty">Ошибка</div>';}
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function formatTime(sec){const m=Math.floor(sec/60),s=sec%60;return`${m}:${String(s).padStart(2,'0')}`;}
function haptic(k){try{const tg=window.Telegram&&window.Telegram.WebApp;if(!tg||!tg.HapticFeedback)return;if(['success','error','warning'].includes(k))tg.HapticFeedback.notificationOccurred(k);else tg.HapticFeedback.impactOccurred(k||'light');}catch(e){}}
function askConfirm(msg){return new Promise(r=>{try{const tg=window.Telegram&&window.Telegram.WebApp;if(tg&&typeof tg.showConfirm==='function'){tg.showConfirm(msg,ok=>r(!!ok));return;}}catch(e){}r(window.confirm(msg));});}
let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400);}
window.addEventListener('message',e=>{if(e.data&&e.data.type==='petzker-theme')document.documentElement.setAttribute('data-theme',e.data.value==='dark'?'dark':'light');});

const DIFFICULTIES={easy:{rows:8,cols:8,mines:10},medium:{rows:12,cols:12,mines:30},hard:{rows:16,cols:16,mines:40}};
let difficulty='easy',cells=[],boardEl=null,gameOver=false,won=false,startTime=null,timerInterval=null,flagCount=0,revealedCount=0,totalMines=10;

function setDifficulty(d,e){
  difficulty=d;
  document.querySelectorAll('.m-diff-btn').forEach(b=>b.classList.remove('active'));
  if(e&&e.target)e.target.classList.add('active');
  else document.querySelectorAll('.m-diff-btn').forEach(b=>{if(b.textContent.toLowerCase().includes(d))b.classList.add('active');});
  init();
}
function getConfig(){return DIFFICULTIES[difficulty];}

function initBoard(){
  const cfg=getConfig(); cells=[];
  for(let r=0;r<cfg.rows;r++){const row=[];for(let c=0;c<cfg.cols;c++)row.push({mine:false,revealed:false,flag:false,num:0});cells.push(row);}
  let placed=0;
  while(placed<cfg.mines){const r=Math.floor(Math.random()*cfg.rows);const c=Math.floor(Math.random()*cfg.cols);if(!cells[r][c].mine){cells[r][c].mine=true;placed++;}}
  for(let r=0;r<cfg.rows;r++)for(let c=0;c<cfg.cols;c++){if(cells[r][c].mine)continue;let count=0;for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=r+dr,nc=c+dc;if(nr>=0&&nr<cfg.rows&&nc>=0&&nc<cfg.cols&&cells[nr][nc].mine)count++;}cells[r][c].num=count;}
  totalMines=cfg.mines;flagCount=0;revealedCount=0;
}
function renderBoard(){
  const cfg=getConfig();if(!boardEl)boardEl=document.getElementById('board');
  boardEl.innerHTML='';boardEl.style.gridTemplateColumns=`repeat(${cfg.cols},1fr)`;boardEl.style.gridTemplateRows=`repeat(${cfg.rows},1fr)`;
  for(let r=0;r<cfg.rows;r++)for(let c=0;c<cfg.cols;c++){
    const cell=cells[r][c];const div=document.createElement('div');div.className='m-cell';div.dataset.r=r;div.dataset.c=c;
    if(cell.revealed){div.classList.add('revealed');if(cell.mine){div.classList.add('mine');div.textContent='💣';}else if(cell.num>0){const ns=document.createElement('span');ns.className='num-'+cell.num;ns.textContent=cell.num;div.appendChild(ns);}}
    else if(cell.flag)div.classList.add('flag');
    div.addEventListener('click',()=>revealCell(r,c));div.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c);});
    boardEl.appendChild(div);
  }
  document.getElementById('flags').textContent=flagCount;
  document.getElementById('timer').textContent=formatTime(startTime?Math.floor((Date.now()-startTime)/1000):0);
}
function revealCell(r,c){
  if(gameOver||cells[r][c].revealed||cells[r][c].flag)return;
  if(!startTime){startTime=Date.now();startTimer();}
  if(cells[r][c].mine){endGame(false);return;}
  const stack=[[r,c]];const cfg=getConfig();
  while(stack.length){const[cr,cc]=stack.pop();if(cells[cr][cc].revealed||cells[cr][cc].flag)continue;cells[cr][cc].revealed=true;revealedCount++;
    if(cells[cr][cc].num===0)for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const nr=cr+dr,nc=cc+dc;if(nr>=0&&nr<cfg.rows&&nc>=0&&nc<cfg.cols&&!cells[nr][nc].revealed&&!cells[nr][nc].flag)stack.push([nr,nc]);}}
  renderBoard();checkWin();
}
function toggleFlag(r,c){if(gameOver||cells[r][c].revealed)return;if(!startTime){startTime=Date.now();startTimer();}cells[r][c].flag=!cells[r][c].flag;flagCount+=cells[r][c].flag?1:-1;renderBoard();haptic('light');}
function startTimer(){timerInterval=setInterval(()=>{if(!gameOver&&startTime)document.getElementById('timer').textContent=formatTime(Math.floor((Date.now()-startTime)/1000));},200);}
function checkWin(){if(gameOver)return;const cfg=getConfig();if(revealedCount===cfg.rows*cfg.cols-cfg.mines)endGame(true);}
async function endGame(won_){
  if(gameOver)return;gameOver=true;won=won_;clearInterval(timerInterval);
  const elapsed=startTime?Math.floor((Date.now()-startTime)/1000):0;
  if(!won_){const cfg=getConfig();for(let r=0;r<cfg.rows;r++)for(let c=0;c<cfg.cols;c++)if(cells[r][c].mine)cells[r][c].revealed=true;renderBoard();}
  document.getElementById('modal-emoji').textContent=won_?'🎉':'💥';
  document.getElementById('modal-title').textContent=won_?'Вы выиграли!':'Вы проиграли';
  document.getElementById('final-time').textContent=formatTime(elapsed);
  const ratingEl=document.getElementById('modal-rating');
  const bestEl=document.getElementById('final-best-note');
  if(won_){
    const pts=await reportWin(elapsed,difficulty);
    ratingEl.textContent=`💎 +${pts} к рейтингу Petzker`;
    bestEl.textContent='✅ Очки записаны!';
    haptic('success');
  }else{ratingEl.textContent='';bestEl.textContent='';haptic('error');}
  document.getElementById('game-over-overlay').classList.add('open');
  refreshLeaderboard();
}
async function confirmNewGame(){if(!gameOver&&startTime){const ok=await askConfirm('Начать новую игру?');if(!ok)return;}init();}
function init(){
  resolvePlayer();
  document.getElementById('player-name').textContent=player?`👤 ${player.name}`:'👤 Гость — рейтинг не сохраняется';
  gameOver=false;won=false;startTime=null;clearInterval(timerInterval);sessionPts=0;
  document.getElementById('session-pts').textContent='+0';
  document.getElementById('timer').textContent='0:00';
  document.getElementById('game-over-overlay').classList.remove('open');
  initBoard();renderBoard();loadRating();refreshLeaderboard();
  if(window.Telegram&&window.Telegram.WebApp)try{window.Telegram.WebApp.ready();}catch(e){}
}
init();
</script>
</body>
</html>
